name: Installer checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nftables iptables iproute2 php-cli openssl util-linux psmisc
      - name: Validate installer, prompts, PKI and isolated firewall traffic
        run: sudo bash tests/run_checks.sh
